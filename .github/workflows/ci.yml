name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(gzip -c dist/assets/index-*.js | wc -c | tr -d ' ')
          LIMIT=$((400 * 1024))
          echo "Bundle size (gzip): ${SIZE} bytes"
          if [ "${SIZE}" -gt "${LIMIT}" ]; then
            echo "Error: bundle size ${SIZE} bytes exceeds ${LIMIT} bytes budget"
            exit 1
          fi
